[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-auto-python"
version = "0.0.1"
description = "Schedule a GitHub Projects backlog into Google Calendar, as a CLI or an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "google-calendar", "github-projects", "scheduling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "mcp>=1.29,<1.30",
  "requests",
]

[project.urls]
Homepage = "https://github.com/danielsousaoliveira/auto-calendar-python"
Source = "https://github.com/danielsousaoliveira/auto-calendar-python"
Issues = "https://github.com/danielsousaoliveira/auto-calendar-python/issues"

[project.scripts]
cal-auto-python = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-mock",
  "ruff",
  "mypy",
  "build",
  "twine",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["var-annotated"]
