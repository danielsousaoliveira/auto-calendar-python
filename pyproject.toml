[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-auto-python"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "requests",
]

[project.scripts]
cal-auto-python = "src.main:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-mock",
]
